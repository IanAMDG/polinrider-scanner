name: Reusable PolinRider scan

on:
  workflow_call:
    inputs:
      git_history:
        description: Scan every blob reachable from the caller's local Git refs
        required: false
        default: true
        type: boolean
      include_vendor:
        description: Include dependency and build directories
        required: false
        default: false
        type: boolean
      fail_on:
        description: Lowest finding severity that fails the job
        required: false
        default: high
        type: string
      upload_sarif:
        description: Attempt to upload results to GitHub code scanning
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Read-only repository and history scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository being scanned
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          path: target
          persist-credentials: false

      - name: Check out the scanner at the called workflow commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: scanner
          persist-credentials: false

      - name: Scan without executing repository code
        id: scan
        shell: bash
        env:
          FAIL_ON: ${{ inputs.fail_on }}
          GIT_HISTORY: ${{ inputs.git_history }}
          INCLUDE_VENDOR: ${{ inputs.include_vendor }}
        run: |
          set -uo pipefail

          case "$FAIL_ON" in
            low|medium|high|critical) ;;
            *)
              echo "Invalid fail_on value: $FAIL_ON" >&2
              echo "Expected one of: low, medium, high, critical." >&2
              echo "status=2" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          args=(
            "$GITHUB_WORKSPACE/target"
            --progress always
            --format github
            --sarif "$GITHUB_WORKSPACE/polinrider-results.sarif"
            --fail-on "$FAIL_ON"
          )
          if [[ "$GIT_HISTORY" == "true" ]]; then
            args+=(--git-history)
          fi
          if [[ "$INCLUDE_VENDOR" == "true" ]]; then
            args+=(--include-vendor)
          fi

          python3 "$GITHUB_WORKSPACE/scanner/tools/polinrider_scan.py" "${args[@]}"
          scan_status=$?
          echo "status=$scan_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload SARIF when requested
        if: always() && inputs.upload_sarif
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: polinrider-results.sarif
          category: polinrider-static-scan

      - name: Enforce the scan result
        if: always()
        shell: bash
        env:
          SCAN_STATUS: ${{ steps.scan.outputs.status }}
          FAIL_ON: ${{ inputs.fail_on }}
        run: |
          if [[ "$SCAN_STATUS" == "1" ]]; then
            echo "PolinRider scan found an indicator at or above $FAIL_ON severity." >&2
            exit 1
          fi
          if [[ "$SCAN_STATUS" != "0" ]]; then
            echo "PolinRider scan was incomplete (status: ${SCAN_STATUS:-missing})." >&2
            exit 2
          fi

# Copy this file to .github/workflows/polinrider-scan.yml in the repository to scan.
# The reusable workflow is pinned to the exact reviewed scanner commit below.
name: PolinRider malware scan

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    uses: IanAMDG/polinrider-scanner/.github/workflows/reusable-scan.yml@b978aaf500cab2f55a2c13515d2bfc3befd463d2
    with:
      git_history: true
      fail_on: high
      upload_sarif: true

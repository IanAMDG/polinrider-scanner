# Copy this file to .github/workflows/polinrider-scan.yml in the repository to scan.
# Replace REPLACE_WITH_FULL_COMMIT_SHA with a reviewed commit from the scanner repo.
name: PolinRider malware scan

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    uses: IanAMDG/polinrider-scanner/.github/workflows/reusable-scan.yml@REPLACE_WITH_FULL_COMMIT_SHA
    with:
      git_history: true
      fail_on: high
      upload_sarif: true
